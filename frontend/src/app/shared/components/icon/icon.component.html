<!-- by Jeremy Posada -->
<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.75"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  focusable="false"
>
  @switch (name()) {
    @case ('shelf') {
      <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21z" />
      <path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5A2.5 2.5 0 0 1 20 21z" />
    }
    @case ('loans') {
      <path d="M6 3h12v18l-6-4-6 4z" />
      <path d="M12 8v3.5l2 1.5" />
    }
    @case ('chart') {
      <path d="M4 20V10" />
      <path d="M10 20V4" />
      <path d="M16 20v-7" />
      <path d="M22 20H2" />
    }
    @case ('logout') {
      <path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4" />
      <path d="M15 8l4 4-4 4" />
      <path d="M19 12H9" />
    }
    @case ('search') {
      <circle cx="11" cy="11" r="6.5" />
      <path d="M20 20l-4-4" />
    }
    @case ('plus') {
      <path d="M12 5v14" />
      <path d="M5 12h14" />
    }
    @case ('x') {
      <path d="M6 6l12 12" />
      <path d="M18 6L6 18" />
    }
    @case ('check') {
      <path d="M5 12.5l4.5 4.5L19 7.5" />
    }
    @case ('alert') {
      <path d="M12 3l9.5 17h-19z" />
      <path d="M12 10v4" />
      <path d="M12 17.5v.01" />
    }
    @case ('clock') {
      <circle cx="12" cy="12" r="8.5" />
      <path d="M12 7.5V12l3 2" />
    }
    @case ('queue') {
      <circle cx="8" cy="8" r="3" />
      <circle cx="17" cy="9" r="2.5" />
      <path d="M2.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5" />
      <path d="M15 18.5c0-2.2 1.3-3.8 3.5-3.8S22 16.3 22 18.5" />
    }
    @case ('arrow-left') {
      <path d="M19 12H5" />
      <path d="M11 6l-6 6 6 6" />
    }
    @case ('arrow-right') {
      <path d="M5 12h14" />
      <path d="M13 6l6 6-6 6" />
    }
    @case ('eye') {
      <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" />
      <circle cx="12" cy="12" r="3" />
    }
    @case ('eye-off') {
      <path d="M3 3l18 18" />
      <path d="M10.6 6c.5-.1.9-.1 1.4-.1 6 0 9.5 6.5 9.5 6.5s-1 1.9-2.9 3.6" />
      <path d="M6.6 6.8C4 8.6 2.5 12 2.5 12s3.5 6.5 9.5 6.5c1.8 0 3.4-.6 4.7-1.4" />
      <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
    }
    @case ('sparkle') {
      <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z" />
      <path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z" />
    }
    @case ('unlock') {
      <rect x="4" y="11" width="16" height="10" rx="2" />
      <path d="M8 11V7a4 4 0 0 1 7.5-2" />
    }
    @case ('mail') {
      <rect x="3" y="5" width="18" height="14" rx="2" />
      <path d="M3 7l9 6 9-6" />
    }
    @case ('bookmark') {
      <path d="M6 3h12v18l-6-4-6 4z" />
    }
  }
</svg>
