<div class="grid grid--shelf" role="status" aria-label="Cargando el catálogo">
  @for (i of huecos(); track i) {
    <div class="card tome tome--ghost" aria-hidden="true">
      <div class="tome__cover"></div>
      <div class="tome__in">
        <span class="bone" style="width: 82%"></span>
        <span class="bone" style="width: 55%"></span>
        <span class="bone bone--s" style="width: 40%"></span>
        <span class="bone bone--chip"></span>
      </div>
    </div>
  }
</div>
