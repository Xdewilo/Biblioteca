<!-- by Jeremy Posada -->
<div class="veil" role="presentation" (click)="close()">
  <div
    class="sheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="sheet-title"
    [style.maxWidth.px]="width()"
    (click)="$event.stopPropagation()"
  >
    <div class="sheet__top">
      <h2 id="sheet-title" class="sheet__title">{{ title() }}</h2>
      <button type="button" class="btn btn--bare btn--icon" aria-label="Cerrar" (click)="close()">
        <app-icon name="x" [size]="18" />
      </button>
    </div>
    <div class="sheet__in"><ng-content /></div>
    <div class="sheet__foot"><ng-content select="[sheetFooter]" /></div>
  </div>
</div>
