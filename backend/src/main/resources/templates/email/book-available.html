<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Ya esta disponible el libro que esperabas</title>
</head>
<body style="margin:0;padding:24px 12px;background:#f2f4f7;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;">

    <th:block th:replace="~{email/_fragments :: header('Ya esta disponible el libro que esperabas', '#027a48')}"></th:block>

    <tr>
        <td style="padding:28px 32px 4px;">
            <p style="margin:0 0 18px;font-size:15px;line-height:1.6;color:#344054;">
                Buenas noticias: el libro que pediste el
                <strong th:text="${requestedAt}">01 de enero</strong> acaba de volver a la biblioteca
                y quedo <strong>reservado a tu nombre</strong>.
            </p>

            <th:block th:replace="~{email/_fragments :: bookCard}"></th:block>

            <table role="presentation" cellpadding="0" cellspacing="0" width="100%"
                   style="background:#ecfdf3;border:1px solid #abefc6;border-radius:10px;">
                <tr>
                    <td style="padding:18px;font-size:14px;color:#05603a;line-height:1.6;">
                        Eres la primera persona de la lista de espera. Entra a la aplicacion y confirma
                        el prestamo; si no lo haces, el turno pasara a la siguiente persona de la fila.
                    </td>
                </tr>
            </table>

            <p style="margin:22px 0 4px;">
                <a th:href="${appUrl}"
                   style="display:inline-block;padding:12px 22px;background:#027a48;color:#ffffff;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;">
                    Confirmar mi prestamo
                </a>
            </p>
        </td>
    </tr>

    <th:block th:replace="~{email/_fragments :: footer}"></th:block>
</table>
</body>
</html>
