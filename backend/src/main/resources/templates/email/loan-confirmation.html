<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Prestamo confirmado</title>
</head>
<body style="margin:0;padding:24px 12px;background:#f2f4f7;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;">

    <th:block th:replace="~{email/_fragments :: header('Tu prestamo quedo registrado', '#1d4ed8')}"></th:block>

    <tr>
        <td style="padding:28px 32px 4px;">
            <p style="margin:0 0 18px;font-size:15px;line-height:1.6;color:#344054;">
                Hola <strong th:text="${borrowerName}">Nombre</strong>, ya tienes este libro en prestamo.
            </p>

            <th:block th:replace="~{email/_fragments :: bookCard}"></th:block>

            <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                    <td style="padding:12px 0;border-top:1px solid #eaecf0;font-size:14px;color:#475467;">
                        Fecha del prestamo
                    </td>
                    <td style="padding:12px 0;border-top:1px solid #eaecf0;font-size:14px;color:#101828;text-align:right;font-weight:600;"
                        th:text="${loanDate}">01 de enero</td>
                </tr>
                <tr>
                    <td style="padding:12px 0;border-top:1px solid #eaecf0;font-size:14px;color:#475467;">
                        Fecha limite de devolucion
                    </td>
                    <td style="padding:12px 0;border-top:1px solid #eaecf0;font-size:14px;color:#b42318;text-align:right;font-weight:700;"
                        th:text="${dueDate}">15 de enero</td>
                </tr>
            </table>

            <p style="margin:20px 0 8px;font-size:14px;line-height:1.6;color:#475467;">
                Te enviaremos un recordatorio un par de dias antes de que venza.
                Devolver a tiempo evita atrasos: con tres atrasos en 90 dias la cuenta
                queda bloqueada una semana.
            </p>
        </td>
    </tr>

    <th:block th:replace="~{email/_fragments :: footer}"></th:block>
</table>
</body>
</html>
