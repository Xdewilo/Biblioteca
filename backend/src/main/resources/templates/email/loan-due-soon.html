<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Tu prestamo vence pronto</title>
</head>
<body style="margin:0;padding:24px 12px;background:#f2f4f7;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;">

    <th:block th:replace="~{email/_fragments :: header('Tu prestamo vence pronto', '#b54708')}"></th:block>

    <tr>
        <td style="padding:28px 32px 4px;">
            <p style="margin:0 0 18px;font-size:15px;line-height:1.6;color:#344054;">
                Hola <strong th:text="${borrowerName}">Nombre</strong>,
                <span th:if="${dueToday}">tu prestamo vence <strong>hoy</strong>.</span>
                <span th:unless="${dueToday}">
                    faltan <strong th:text="${daysLeft}">2</strong>
                    <span th:text="${daysLeft == 1} ? 'dia' : 'dias'">dias</span>
                    para la fecha limite de devolucion.
                </span>
            </p>

            <th:block th:replace="~{email/_fragments :: bookCard}"></th:block>

            <table role="presentation" cellpadding="0" cellspacing="0" width="100%"
                   style="background:#fffaeb;border:1px solid #fedf89;border-radius:10px;">
                <tr>
                    <td style="padding:16px;font-size:14px;color:#93370d;line-height:1.6;">
                        Fecha limite: <strong th:text="${dueDate}">15 de enero</strong>.<br/>
                        Si no alcanzas a devolverlo, cuenta como atraso.
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <th:block th:replace="~{email/_fragments :: footer}"></th:block>
</table>
</body>
</html>
