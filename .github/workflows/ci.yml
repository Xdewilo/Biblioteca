name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · mvn test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Las pruebas usan H2 en memoria y GreenMail: no hace falta Postgres ni Docker.
      - run: mvn -B --no-transfer-progress test
        working-directory: backend

  frontend:
    name: Frontend · lint + Jasmine + ng build
    runs-on: ubuntu-latest
    env:
      CHROME_BIN: /usr/bin/google-chrome   # Chrome viene preinstalado en ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint:no-inline
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
